name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and publish (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
            architecture: x64
          - runtime: win-arm64
            runner: windows-11-arm
            architecture: arm64
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          architecture: ${{ matrix.architecture }}

      - name: Check source structure and resources
        run: python tools/check_structure.py

      # The same script builds and runs all four check groups locally and in CI.
      # Each job executes WPF and native Windows checks on its own architecture.
      - name: Build and verify, including WPF
        run: ./Verify.ps1 -Runtime ${{ matrix.runtime }} -NoColor

      # These must stay sequential: both variants use the same project obj files.
      - name: Publish framework-dependent
        run: ./Build.ps1 -Publish -Runtime ${{ matrix.runtime }} -NoColor

      - name: Publish self-contained
        run: ./Build.ps1 -Publish -Runtime ${{ matrix.runtime }} -SelfContained -NoColor

      - name: Upload framework-dependent package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FileScope-${{ matrix.runtime }}-framework-dependent
          path: artifacts/publish/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload self-contained package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FileScope-${{ matrix.runtime }}-self-contained
          path: artifacts/publish/${{ matrix.runtime }}_self-contained/
          if-no-files-found: error
          retention-days: 14
